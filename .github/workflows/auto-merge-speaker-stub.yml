name: Auto-merge speaker-stub PRs

# Triggered when /workshop-full skill в aim-lms открывает mirror PR
# с новым speaker entry в data/speakers.js. Gates проверяют что diff
# действительно append-only к speakers/s3Speakers array, и автоматически
# мерджат — иначе TG notify в triage thread.
#
# Setup (одноразовый, owner action):
#   - Repository secrets: AIM_OPS_TELEGRAM_BOT_TOKEN, AIM_OPS_TELEGRAM_CHAT_ID
#   - Label "speaker-stub" должен существовать в репо

on:
  pull_request:
    types: [opened, synchronize, labeled]

concurrency:
  group: speakers-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: contains(github.event.pull_request.labels.*.name, 'speaker-stub')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify только data/speakers.js изменён
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA")
          if [[ "$changed" != "data/speakers.js" ]]; then
            echo "FAIL: PR touches files other than data/speakers.js"
            echo "Changed files:"
            echo "$changed"
            exit 1
          fi
          echo "OK: only data/speakers.js changed"

      - name: Verify append-only diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          diff_file=$(mktemp)
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          git diff --no-color --unified=0 "$merge_base" "$HEAD_SHA" -- data/speakers.js >"$diff_file"

          deletions=$(grep -cE '^-[^-]' "$diff_file" || true)
          if [ "$deletions" -gt 0 ]; then
            echo "FAIL: PR has $deletions deletion lines — gate enforces append-only"
            grep -E '^-[^-]' "$diff_file" | head -10
            exit 1
          fi

          append_anchor() {
            local array_name="$1"
            git show "$merge_base:data/speakers.js" | awk -v array_name="$array_name" '
              $0 ~ "const " array_name " = \\[" { in_array = 1; next }
              in_array && /^[[:space:]]*\];$/ { print NR - 1; found = 1; exit }
              END { if (!found) exit 1 }
            '
          }

          speakers_anchor=$(append_anchor speakers)
          s3_speakers_anchor=$(append_anchor s3Speakers)
          invalid_hunks=0

          while IFS= read -r header; do
            old_start=$(printf '%s\n' "$header" | sed -E 's/^@@ -([0-9]+)(,[0-9]+)? \+.*/\1/')
            old_count=$(printf '%s\n' "$header" | sed -nE 's/^@@ -[0-9]+,([0-9]+) \+.*/\1/p')
            old_count=${old_count:-1}

            if [ "$old_count" != "0" ] || { [ "$old_start" != "$speakers_anchor" ] && [ "$old_start" != "$s3_speakers_anchor" ]; }; then
              echo "FAIL: non-append hunk $header"
              invalid_hunks=$((invalid_hunks + 1))
            fi
          done < <(grep '^@@ ' "$diff_file")

          if [ "$invalid_hunks" -gt 0 ]; then
            echo "FAIL: additions must append to the end of speakers or s3Speakers"
            exit 1
          fi

          echo "OK: append-only diff verified for speakers/s3Speakers"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: node --check data/speakers.js
        run: node --check data/speakers.js

      - name: Merge PR
        env:
          # Default GITHUB_TOKEN read-only — org policy locks write permissions
          # на repo-level. Используем contributor PAT (OXI-717) через secret.
          GH_TOKEN: ${{ secrets.AUTO_MERGE_PAT }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUM" --squash --delete-branch
          echo "OK: PR #$PR_NUM merged"

      - name: TG notify on failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.AIM_OPS_TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.AIM_OPS_TELEGRAM_CHAT_ID }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "WARN: TG secrets не сконфигурированы — skip notification"
            exit 0
          fi
          msg=$(printf '🔴 aim-studio speaker-stub auto-merge упал\n\nPR #%s: %s\nRun: %s\n\nНужен manual review — либо PR не append-only, либо trogает другие файлы, либо broken JS.' "$PR_NUM" "$PR_TITLE" "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${msg}" \
            --data-urlencode "disable_web_page_preview=true" >/dev/null || true
